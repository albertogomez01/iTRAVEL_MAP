<!DOCTYPE html>
<html lang="es-ES">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTRAVEL_MAP - Tu Copiloto de Viajes con IA</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>
        <style>
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Markdown styles */
        .prose p { margin-bottom: 0.75em; }
        .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 0.75em; }
        .prose strong { font-weight: 600; color: #1e293b; }
        .prose a { color: #0d9488; text-decoration: underline; }

        /* Leaflet overrides to prevent z-index issues with Tailwind */
        .leaflet-container { z-index: 0 !important; }

        /* Animated Route Line */
        .animated-route {
            animation: dash 20s linear infinite;
        }
        @keyframes dash {
            to {
                stroke-dashoffset: -1000;
            }
        }

        /* Logo Animations */
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.04); }
        }
        @keyframes logoPulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(20, 184, 166, 0.4), 0 0 40px rgba(13, 148, 136, 0.2); }
            50% { box-shadow: 0 0 45px rgba(20, 184, 166, 0.8), 0 0 80px rgba(13, 148, 136, 0.5); }
        }
        @keyframes orbitSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animated-logo-glow {
            animation: logoPulseGlow 3s ease-in-out infinite, logoFloat 4s ease-in-out infinite;
        }
        .orbit-ring {
            animation: orbitSpin 10s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 h-screen overflow-hidden flex flex-col">
    <div id="root" class="h-full flex flex-col"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
