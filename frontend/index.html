    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('Service Worker registrado con éxito:', reg.scope);
          }).catch((err) => {
            console.warn('Error registrando Service Worker:', err);
          });
        });
      }
    </script>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6350264370547424" crossorigin="anonymous"></script>
    

    <!-- Tailwind CSS CDN Fallback & Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }
        h1, h2, h3, h4, .font-heading {
            font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #0d9488; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Markdown styles */
        .prose p { margin-bottom: 0.75em; }
        .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 0.75em; }
        .prose strong { font-weight: 600; color: #f8fafc; }
        .prose a { color: #2dd4bf; text-decoration: underline; }

        /* Leaflet overrides */
        .leaflet-container { z-index: 0 !important; font-family: inherit !important; }
        .leaflet-popup { max-width: 90vw !important; }
        .leaflet-popup-content-wrapper {
            background: #ffffff !important;
            color: #0f172a !important;
            border-radius: 1rem !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.2) !important;
            padding: 4px !important;
            max-height: 60vh !important;
            overflow-y: auto !important;
        }
        .leaflet-popup-tip {
            background: #ffffff !important;
        }
        .leaflet-popup-close-button {
            color: #64748b !important;
            padding: 8px 10px !important;
        }
        .leaflet-popup-close-button:hover {
            color: #0f172a !important;
        }

        /* Animations */
        .animated-route {
            animation: dash 25s linear infinite;
            will-change: stroke-dashoffset;
            transform: translateZ(0);
        }
        @keyframes dash { to { stroke-dashoffset: -1000; } }
        
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.04); }
        }
        @keyframes logoPulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(20, 184, 166, 0.4), 0 0 40px rgba(13, 148, 136, 0.2); }
            50% { box-shadow: 0 0 45px rgba(20, 184, 166, 0.8), 0 0 80px rgba(13, 148, 136, 0.5); }
        }
        .animated-logo-glow { animation: logoPulseGlow 3s ease-in-out infinite, logoFloat 4s ease-in-out infinite; }
        .orbit-ring { animation: orbitSpin 10s linear infinite; }
        @keyframes orbitSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen overflow-hidden flex flex-col">
